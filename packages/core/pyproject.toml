[project]
name = "core"
version = "0.1.0"
description = "App config, model/blob/queue clients, and helpers common to all apps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-aws>=0.2",
    "langchain-ollama>=0.2",
    "pika>=1.3",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "types-boto3[bedrock-runtime,essential]>=1.35",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.basedpyright]
venvPath = "../../"
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
